version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    # Supply-chain safety: ignore releases younger than N days
    cooldown:
      default-days: 3
      semver-major-days: 14
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      # Packages that must move in lockstep (all update types)
      nextjs:
        patterns:
          - "next"
          - "eslint-config-next"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      # Everything else: one PR for minor+patch; majors stay separate
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
